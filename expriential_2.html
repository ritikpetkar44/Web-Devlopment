  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f2f2f2;
    }

    header {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }

    .toolbar {
      background: #555;
      padding: 10px;
      text-align: center;
    }

    /* ✨ BUTTON STYLE + ANIMATION */
    .toolbar button {
      padding: 8px 15px;
      margin: 5px;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    /* 🌟 HOVER EFFECT */
    .toolbar button:hover {
      background: #00c3ff;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 5px 15px rgba(0, 195, 255, 0.4);
    }

    /* CLICK EFFECT */
    .toolbar button:active {
      transform: scale(0.95);
    }

    textarea {
      width: 90%;
      height: 400px;
      margin: 20px auto;
      display: block;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #ccc;
      transition: 0.3s;
    }

    textarea:focus {
      border-color: #00c3ff;
      box-shadow: 0 0 10px rgba(0,195,255,0.3);
      outline: none;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>NOTEPAD</h1>
</header>

<div class="toolbar">
  <button>Bold</button>
  <button>Italic</button>
  <button>Underline</button>
  <button>Save</button>
</div>

<textarea placeholder="Start something amazing..."></textarea>

<footer>
  Simple Notepad using HTML + CSS
</footer>

</body>
</html>
