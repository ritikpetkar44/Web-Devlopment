<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Text Editor</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }

body {
  display:flex;
  height:100vh;
  background:linear-gradient(135deg,#eef2f3,#dfe9f3);
}

body.dark { background:#1e1e2f; color:white; }

/* SIDEBAR */
.sidebar {
  width:250px;
  background:#ffffffcc;
  backdrop-filter:blur(10px);
  padding:10px;
  overflow-y:auto;
}

body.dark .sidebar { background:#2b2b3d; }

.note {
  padding:10px;
  margin-bottom:8px;
  border-radius:8px;
  cursor:pointer;
  background:#f1f1f1;
  display:flex;
  justify-content:space-between;
}

body.dark .note { background:#3a3a50; }

.note:hover { background:#4CAF50; color:white; }

/* MAIN */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOOLBAR */
.toolbar {
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  background:#ffffffcc;
}

body.dark .toolbar { background:#2b2b3d; }

button {
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover { background:#4CAF50; color:white; }

/* EDITOR */
.editor {
  flex:1;
  padding:20px;
  margin:10px;
  background:white;
  border-radius:12px;
  overflow:auto;
  outline:none;
}

body.dark .editor { background:#2b2b3d; }

/* FOOTER */
.footer {
  text-align:center;
  padding:10px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>📂 Notes</h3>
  <button onclick="saveNote()">➕ Save Note</button>
  <div id="notesList"></div>
</div>

<!-- MAIN -->
<div class="main">

<div class="toolbar">
  <button onclick="format('bold')"><b>B</b></button>
  <button onclick="format('italic')"><i>I</i></button>
  <button onclick="format('underline')"><u>U</u></button>
  <button onclick="format('removeFormat')">Clear Format</button>
  <button onclick="clearEditor()">Clear</button>
  <button onclick="toggleDarkMode()">🌙</button>
</div>

<div class="editor" contenteditable="true" id="editor">
Start typing...
</div>

<div class="footer">
  Words: <span id="wordCount">0</span> | Characters: <span id="charCount">0</span>
</div>

</div>

<script>
const editor = document.getElementById("editor");
const notesList = document.getElementById("notesList");

/* FORMAT */
function format(cmd){
  document.execCommand(cmd,false,null);
}

/* CLEAR */
function clearEditor(){
  editor.innerHTML="";
}

/* DARK MODE */
function toggleDarkMode(){
  document.body.classList.toggle("dark");
}

/* WORD COUNT */
editor.addEventListener("input", ()=>{
  const text = editor.innerText;
  const words = text.trim().split(/\s+/).filter(w=>w.length>0);
  document.getElementById("wordCount").innerText = words.length;
  document.getElementById("charCount").innerText = text.length;
});

/* STORAGE */
function getNotes(){
  return JSON.parse(localStorage.getItem("notes") || "[]");
}

function saveNotes(notes){
  localStorage.setItem("notes", JSON.stringify(notes));
}

/* SAVE NOTE */
function saveNote(){
  const content = editor.innerHTML;
  if(!content.trim()) return alert("Empty note!");

  const notes = getNotes();
  const newNote = {
    id: Date.now(),
    content: content,
    preview: editor.innerText.substring(0,20)
  };

  notes.unshift(newNote);
  saveNotes(notes);
  renderNotes();
}

/* LOAD NOTE */
function loadNote(id){
  const notes = getNotes();
  const note = notes.find(n=>n.id===id);
  if(note) editor.innerHTML = note.content;
}

/* DELETE NOTE */
function deleteNote(id){
  let notes = getNotes();
  notes = notes.filter(n=>n.id!==id);
  saveNotes(notes);
  renderNotes();
}

/* RENDER NOTES */
function renderNotes(){
  const notes = getNotes();
  notesList.innerHTML = "";

  notes.forEach(n=>{
    const div = document.createElement("div");
    div.className = "note";
    
    div.innerHTML = `
      <span onclick="loadNote(${n.id})">${n.preview}...</span>
      <span onclick="deleteNote(${n.id})">❌</span>
    `;
    
    notesList.appendChild(div);
  });
}

/* INIT */
renderNotes();

</script>

</body>
</html>
