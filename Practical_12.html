<!DOCTYPE html>
<html>
<head>
<title>Bootstrap Demo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand">MySite</a>
  </div>
</nav>

<!-- Carousel -->
<div id="c" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRglZmQOuxMTjTUTc2Ytag7HS2tACZgQ7LMSA&s" class="w-100">
    </div>
    <div class="carousel-item">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRglZmQOuxMTjTUTc2Ytag7HS2tACZgQ7LMSA&s" class="w-100">
    </div>
  </div>
</div>

<!-- Cards -->
<div class="container mt-3">
  <div class="row">

    <div class="col-md-4">
      <div class="card p-2">
        <h5>Card 1</h5>
        <button class="btn btn-primary">Click</button>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-2">
        <h5>Card 2</h5>
        <button class="btn btn-success">Click</button>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-2">
        <h5>Card 3</h5>
        <button class="btn btn-danger">Click</button>
      </div>
    </div>

  </div>
</div>

<!-- Buttons + Spinner -->
<div class="text-center mt-3">
  <button class="btn btn-primary">Primary</button>
  <button class="btn btn-warning">Warning</button>
  <div class="spinner-border text-primary mt-2"></div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-2 mt-3">
  My Website
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
