<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="25%" stop-color="#cfcfcf"/>
      <stop offset="50%" stop-color="#8d8d8d"/>
      <stop offset="75%" stop-color="#4b4b4b"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <text
    x="50%"
    y="120"
    text-anchor="middle"
    font-family="Orbitron, Arial, sans-serif"
    font-size="110"
    font-weight="900"
    letter-spacing="8"
    fill="url(#metal)"
    filter="url(#shadow)">
    AURON
  </text>
</svg>